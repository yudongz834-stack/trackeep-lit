# mutmut（变异测试，BL-08 / policy R2-05）配置——由 .github/workflows/mutation.yml 在 CI 使用。
# mutmut 官方不支持 Windows，本地不跑；每发布周期在 CI 手动触发一轮（母法 7.7）。
# 变异面 = lit/ 数据层 7 文件；config.py 除外：纯常量无逻辑，变异无意义（母法 2.4 一句话理由）。
# runner = smoke（离线逻辑全链路、退出码全过才 0）；gui/stress/property 需 Qt 或单跑过重，不进 per-mutant 循环。
[mutmut]
paths_to_mutate=lit/deepseek.py,lit/engine.py,lit/journals.py,lit/ledger.py,lit/overrides.py,lit/strategy.py,lit/zotero.py
runner=python tests/smoke_test.py
tests_dir=tests/
