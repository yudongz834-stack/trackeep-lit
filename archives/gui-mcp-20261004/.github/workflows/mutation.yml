# Trackeep Lit — 变异测试（BL-08 / policy R2-05，母法 7.7）
#
# 手动触发（workflow_dispatch）：每发布周期一轮，不进 push 门禁——单轮几十分钟，
# 且杀灭率是分析义务不是发布闸（<70% → 逐个分析存活变异体，结论回流测试/invariants）。
# 工具：mutmut 2.5.1（3.x 强绑 pytest 收集，本仓测试是脚本形；2.x 支持任意 runner 命令）。
# Python 3.11：mutmut 2.x 依赖 pony ORM、对 3.13 兼容未验——杀灭率测的是测试套强度，
# 与解释器小版本无关，3.11 上的结论对 3.13 成立。
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRACKEEP_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mutmut（runner 只碰 lit/=纯标准库，PySide6 不装）
        run: python -m pip install "mutmut==2.5.1"

      - name: Baseline（runner 必须先绿——红则整个 job 停，不进变异循环）
        run: python tests/smoke_test.py

      - name: Run mutmut（变异面/runner 见 setup.cfg）
        # 存在存活变异体时 mutmut 非零退出——本轮是测量不是闸，靠下一步出报告
        run: mutmut run || true

      - name: Report（计数 + 杀灭率 + 存活变异体逐个 diff）
        shell: bash
        run: |
          { echo "== mutmut results =="; mutmut results; } | tee mutation-report.txt
          killed=$(mutmut result-ids killed 2>/dev/null | wc -w)
          survived=$(mutmut result-ids survived 2>/dev/null | wc -w)
          timeout=$(mutmut result-ids timeout 2>/dev/null | wc -w)
          suspicious=$(mutmut result-ids suspicious 2>/dev/null | wc -w)
          total=$((killed+survived+timeout+suspicious))
          {
            echo ""
            echo "== 计数 =="
            echo "killed=$killed survived=$survived timeout=$timeout suspicious=$suspicious total=$total"
            python -c "
          k, t, n = $killed, $timeout, $total
          rate = (k + t) / n * 100 if n else 0
          print(f'杀灭率（killed+timeout / total）= {rate:.1f}%')
          print('达标（≥70%）' if rate >= 70 else '未达标（<70%）——policy R2-05：逐个分析存活变异体')
          "
          } | tee -a mutation-report.txt
          : > survivors.diff
          for id in $(mutmut result-ids survived 2>/dev/null); do
            echo "=== mutant $id ===" >> survivors.diff
            mutmut show "$id" >> survivors.diff || true
          done
          if [ "$total" -gt 0 ] && [ $(( (killed+timeout)*100/total )) -lt 70 ]; then
            echo "::warning::杀灭率未达 70%——按 policy R2-05 逐个分析 survivors.diff"
          fi

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.sha }}
          path: |
            mutation-report.txt
            survivors.diff
          if-no-files-found: error
