# Trackeep Lit — 系统不变量主清单（invariants = 测试断言的主真相源）
#
# 来源：母法 6.4 的项目版本。每条含不变量、护栏（结构性机制 + 代码位置）、证据（自动化验证）。
# 证据一律指向 tests/ 里真实存在的检查；尚无自动断言的诚实标 backlog 并登记进 manifest 待办。
# 不许虚构证据。Agent 可加严（补 evidence），删改须质量复核批准（母法 C.3）。

invariants:

  - id: INV-01
    name: dry-run 零副作用
    invariant: 检索预览路径绝不写 Zotero、绝不动台账——run_search 永不携带 -Execute
    guardrail: engine.run_search 固定 execute=False，argv 仅 run_import 才追加 -Execute（lit/engine.py:34-37 / 94-95）
    evidence:
      - check: "INV-01 组（argv 不含/含 -Execute、-EmitJson、窗口参数）×5"
        file: tests/smoke_test.py

  - id: INV-02
    name: 真实写库仅经用户确认触发
    invariant: 写 Zotero（导入 / 建 collection）只能由用户点「导入」+ 确认框触发，程序任何路径不得静默真写
    guardrail: 导入按钮 → QMessageBox 确认 → _begin_import（ui/pages/harvest_page.py:822-846）；collection 不存在时受控建框、确认才 POST（harvest_page.py:849，护栏⑯）
    evidence:
      - check: "INV-02 组（确认框 No→不调 / Yes→恰 1 次 / 受控建取消→不 POST 不导入）×3"
        file: tests/gui_test.py

  - id: INV-03
    name: 失败不显示为成功
    invariant: 引擎非零退出、超时、stdout 无 MECHA_JSON、网络失败必须报错并人话显示，绝不渲染成成功回执
    guardrail: engine._run_engine 逐类转 RuntimeError（lit/engine.py:98-121，含非法 JSON 转人话——VS-11 修复）；页面 failed 回调显示错误原文（harvest_page.py:605 / 901）
    evidence:
      - check: "INV-03 组（非零退出/无 TRACKEEP_JSON/超时/无 PowerShell/引擎缺失 全转 RuntimeError）×5"
        file: tests/smoke_test.py
      - check: "engine 流对抗（前缀后非法 JSON→人话 等）"
        file: tests/adversarial_test.py

  - id: INV-04
    name: 部分成功不谎报全部成功
    invariant: 导入回执必须如实分列 imported / failed / dup；failed>0 必须提供「重试失败」且不得显示为全部成功
    guardrail: 引擎 JSON counts 分列 + _render_import_receipt 按 status 分组渲染（harvest_page.py:912）
    evidence:
      - check: "INV-04（failed>0 出重试 / failed=0 无重试）"
        file: tests/gui_test.py
      - check: "BL-07① counts≠清单→橙字警示出现 / counts==清单→无警示（search+import 两路）；BL-07② 未知/缺 status→「其他」卡不静默丢（search+import 两路）"
        file: tests/adversarial_test.py
      - note: "BL-07 软观察已加固（2026-07-18）：counts 仍按引擎值显示（真相口径），但与 items 实数不一致时显式警示、不再静默；未知 status 条目进「其他」卡不再丢弃"

  - id: INV-05
    name: 重复导入幂等
    invariant: 同参数重复导入 / 失败重试不得产生重复 Zotero 条目
    guardrail: 导入=引擎重新完整跑（esearch+efetch+去重+POST），不复用预览 items（lit/engine.py:44-53）；引擎全库去重按 DOI/PMID
    evidence:
      - check: "INV-01 组已覆盖 App 侧同构（run_import=同参重跑、不带缓存 items）"
        file: tests/smoke_test.py
      - gap: 引擎侧端到端幂等无自动化（Slice 3 首次真实导入人工验证过；重验需真实 -Execute，属 PI 界面动作）

  - id: INV-06
    name: 台账锚点只归引擎前移
    invariant: App 对采集台账只读（算窗口），绝不写台账；锚点只在引擎导入 POST 成功后前移
    guardrail: ledger.py 仅 read_text 无任何写路径（lit/ledger.py:20-30）；台账文件归引擎所有
    evidence:
      - check: "INV-06（公开 API 只读 + 源码无 write_text）×2 + VS-01 ledger（坏 JSON/缺文件→(60,None)）"
        file: tests/smoke_test.py

  - id: INV-07
    name: 配置写入原子且不伤及无辜
    invariant: journal-overrides.json / strategy.json 写入任何时刻文件要么旧完整要么新完整；改一刊/一分类不得丢其它条目
    guardrail: overrides._atomic_write（mkstemp+os.replace，lit/overrides.py:84-98）；strategy._atomic_write（lit/strategy.py:121-131）；读取 utf-8-sig 兼容 BOM（overrides.py:30 / ledger.py:22）
    evidence:
      - check: "INV-07 组（overrides/strategy 往返、他刊他分类保留、合法 JSON）+ VS-01 脏数据（BOM/半截/空）"
        file: tests/smoke_test.py
      - check: "属性 3/4（500 例往返恒等 + 多刊乱序独立 + 半缺存档恒补全）"
        file: tests/property_test.py

  - id: INV-08
    name: 凭证不进日志 / git / 异常文本
    invariant: Zotero API key、DEEPSEEK_TOKEN 只进请求头；绝不 print、不落日志、不进异常字符串、不进版本库
    guardrail: zotero._request token 仅 add_header、异常文本只含 HTTP 码（lit/zotero.py:41-61）；deepseek 同范式（lit/deepseek.py:56-79）；凭证文件在 ~/.config，仓外
    evidence:
      - check: "INV-08 组（哨兵 token 不入异常文本 / zotero 缺凭证 FileNotFoundError）×3"
        file: tests/smoke_test.py
      - static: CI secret-scan（gitleaks）扫全历史（2026-07-18 起每推必扫，首跑无泄漏）

  - id: INV-09
    name: 单飞——运行中互斥
    invariant: 检索 / 导入 / AI 复筛任一在跑时，其余动作按钮与树切换必须禁用；同一进程同刻至多一个引擎子进程
    guardrail: _begin_running_ui 统一禁用（harvest_page.py:498-516）；_on_import_clicked / _start_ai_filter 入口 _running 直接返回（harvest_page.py:781-782 / 826）；FuncWorker 兜 BaseException 保证 _running 复位（VS-11 加固）
    evidence:
      - check: "INV-09 组（running 态禁用 + 二次入口直返计数不增）×2"
        file: tests/gui_test.py
      - check: "连点/乱点/渲染清空 ×≥50 轮 + drain 终值断言（随机时序抖动，seed 入证据）"
        file: tests/stress_test.py

  - id: INV-10
    name: AI 复筛 advisory 不拦截导入（6b-1 语义）
    invariant: DeepSeek 判决只标注在审计页，导入范围不受其影响（导入仍导入全部新增）
    guardrail: 判决仅 verdict 渲染（harvest_page.py:674 / 737），导入路径不读 verdicts
    evidence:
      status: backlog
      note: 导入路径不读 verdicts 尚无显式断言（代码审查为据）；6b-2 升级真拦截时本条按母法 6.3 修订并落新断言

  - id: INV-11
    name: 命中上限不静默截断
    invariant: found ≥ retmax 上限（1000）必须显式告警（建议按月回填），不得静默丢数据
    guardrail: _RETMAX_WARN=1000 + 审计页橙字告警（harvest_page.py:70-71 / 660，护栏⑫；found 非 int 安全转换——VS-11 修复）
    evidence:
      - check: "INV-11（found=1000 → 截断告警文案）"
        file: tests/gui_test.py
      - check: "found 类型畸形不崩（对抗变体）"
        file: tests/adversarial_test.py
