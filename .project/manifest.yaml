    evidence: "GLM 自报 + 主驾对照本会话早前捕获的原值确认；当前值 = 简版，原值 = 详版"
    recover: "已恢复（2026-07-19，PI 授权直接改）——方案 A（Baidu 版本历史）主驾无云端 GUI 访问、做不到，按 PI 指令转方案 B：主驾本会话捕获的原 criteria 外科式回填（只改胸外 deepseek.criteria，原子写，回读核验其余 4 分类零改动）。恢复前把损坏态备份到 scratchpad（不进公开仓——含 PI 真实科研判据）。⚠ 遗留：回填值结尾括号未闭合（可能是原值本身，也可能本会话捕获截断），待 PI 眼校完整性——如原值更长可 Baidu 历史取权威版或 PI 直接补全"
    notify: 已即时报 PI
    root_cause: "被派 agent 的临时手验脚本未套测试环境隔离；施工单虽写『strategy 只读绝不写』，但只约束交付代码、未约束 agent 的 ad-hoc 验证命令"
