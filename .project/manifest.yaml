# 本次启用的门禁清单。状态统一 pending-ci：文件已落成、CI 首跑前不视为已通过。
# ⚠️ 此后仅由 CI 证据回填；agent 手改 status 为 passed 一律无效。
gates:
  - { id: governance,   status: pending-ci, via: "job:governance（B0=0 / 例外未过期 / 五件套 yaml 可解析）" }
  - { id: tests,        status: pending-ci, via: ".github/workflows/quality-gates.yml job:tests", note: "五套：smoke + gui + stress + adversarial + property（ubuntu offscreen + TRACKEEP_CI 联网跳过，seed 入证据）" }
  - { id: secret-scan,  status: pending-ci, via: "job:secret-scan（gitleaks-action@v2）" }
  - { id: evidence,     status: pending-ci, via: "job:evidence（汇总 sha/时间/统计/跳过计数/产物哈希/lock_hash → evidence-<sha>）" }
  - { id: b0_block,     status: pending-ci, via: "governance job 校验 open_defects.b0==0 + 任一 job 红=工作流红=发布阻断" }
  - { id: branch_protection, status: enabled, via: "2026-07-19 public 仓 main 分支保护（禁 force-push+删除 + required checks + linear history）；EX-01 关闭" }

open_defects:
  b0: 0
  b1: []
  note: "如实按当前状态填；新缺陷由后续会话/CI 回流更新"

