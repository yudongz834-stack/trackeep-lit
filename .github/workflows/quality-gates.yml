# Trackeep Lit — 质量门禁（机器门禁本体，母法 10.3；照搬 Trackeep Quant 方子适配）
#
# 四 job：governance（治理校验）/ tests（测试）/ secret-scan（密钥扫描）/ evidence（证据工件）。
# 任一 job 红 = 工作流红 = 发布阻断（B0 语义，母法 8.6）。
# 证据落 GitHub Actions run artifacts（evidence-<sha>），仓库内不存副本（避免 CI 推回循环）。
name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    # 发布门禁机器化补强（母法 8.1/8.4/10.4）：①manifest open_defects.b0==0
    # ②exceptions 日期型 expires 过期则阻断 ③五件套 yaml 全部可解析。与 tests 并行，红即阻断发布。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Governance checks（B0=0 / 例外未过期 / 五件套可解析）
        run: |
          python - <<'PY'
          import sys, datetime, yaml
          from pathlib import Path
          today = datetime.date.today()
          errors = []
          # ① manifest：open_defects.b0 必须为 0（母法 8.1/8.6：B0 缺陷阻断发布）
          mf = yaml.safe_load(Path(".project/manifest.yaml").read_text(encoding="utf-8"))
          b0 = (mf.get("open_defects") or {}).get("b0", 0)
          if b0 != 0:
              errors.append(f"manifest open_defects.b0={b0}（须为 0）")
          # ② exceptions：日期型 expires 已过期则阻断（条件型 expires 如 'condition' 跳过）
          ef = yaml.safe_load(Path(".project/exceptions.yaml").read_text(encoding="utf-8"))
          for ex in ef.get("exceptions", []) or []:
              exp = ex.get("expires")
              if not isinstance(exp, str):
                  continue
              try:
                  d = datetime.date.fromisoformat(exp)
              except ValueError:
                  continue   # 非日期字符串 = 条件型到期，不在本检查范围
              if d < today:
                  errors.append(f"例外 {ex.get('id')} 已过期（expires={exp}）")
          # ③ 五件套 yaml 全部可解析
          for p in (".project/manifest.yaml", ".project/policy.yaml", ".project/exceptions.yaml",
                    ".project/invariants.yaml", ".project/vulnerable-scenarios.yaml"):
              try:
                  yaml.safe_load(Path(p).read_text(encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{p} 解析失败：{e}")
          if errors:
              for e in errors:
                  print("❌ " + e)
              sys.exit(1)
          print("✅ governance: B0=0、无过期例外、五件套 yaml 可解析")
          PY

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt offscreen system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libxrandr2 libxss1 libxcursor1 \
            libxcomposite1 libasound2t64 libnss3 libnspr4 libxdamage1 libxrender1

      - name: Set up Python (与本地 venv 一致：3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      # 本项目测试自带合成数据 + 全 mock（引擎 spawn / 联网 / Mecha-Core 路径全部 patch），
      # 无需数据注入步。CI 无 Mecha-Core：journals 走静态兜底、测试内 patch 路径到 temp。
      # shell: bash 显式声明 = 启用 pipefail——否则 tee 会吞掉测试脚本的失败退出码
      # （Trackeep Quant 2026-07-17 CI 首跑实测暴露的假绿洞，VS-12 教训直接继承）。
      - name: Run smoke_test (offline logic chain, engine mocked)
        shell: bash
        env:
          TRACKEEP_CI: "1"
        run: |
          python tests/smoke_test.py 2>&1 | tee smoke.log
          grep -qE '[0-9]+/[0-9]+ 项通过' smoke.log

      - name: Run gui_test (offscreen, network blocked via TRACKEEP_CI)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TRACKEEP_SELFTEST: "1"
          TRACKEEP_CI: "1"
        run: |
          python tests/gui_test.py 2>&1 | tee gui.log
          grep -qE '[0-9]+/[0-9]+ 项通过' gui.log

      - name: Run stress_test (offscreen, 竞态/连点 50 轮, seed 记录)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TRACKEEP_SELFTEST: "1"
          TRACKEEP_CI: "1"
        run: |
          python tests/stress_test.py 2>&1 | tee stress.log
          grep -qE '[0-9]+/[0-9]+ 项通过' stress.log

      - name: Run adversarial_test (对抗畸形输入)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TRACKEEP_SELFTEST: "1"
          TRACKEEP_CI: "1"
        run: |
          python tests/adversarial_test.py 2>&1 | tee adversarial.log
          grep -qE '[0-9]+/[0-9]+ 项通过' adversarial.log

      - name: Run property_test (属性/fuzz ≥500 例/属性, seed 记录)
        shell: bash
        env:
          TRACKEEP_CI: "1"
        run: |
          python tests/property_test.py 2>&1 | tee property.log
          grep -qE '[0-9]+/[0-9]+ 项通过' property.log

      - name: Write test-summary.json
        run: |
          python - <<'PY'
          import re, json
          from pathlib import Path
          def grab(log, pat):
              m = re.findall(pat, Path(log).read_text(encoding="utf-8", errors="replace"))
              return m[-1] if m else "?"
          summary = {
              "smoke_pass": grab("smoke.log", r'(\d+/\d+ 项通过)'),
              "gui_pass": grab("gui.log", r'(\d+/\d+ 项通过)'),
              "stress_pass": grab("stress.log", r'(\d+/\d+ 项通过)'),
              "adversarial_pass": grab("adversarial.log", r'(\d+/\d+ 项通过)'),
              "property_pass": grab("property.log", r'(\d+/\d+ 项通过)'),
              "stress_seed": grab("stress.log", r'seed=(\d+)'),
              "property_seed": grab("property.log", r'seed=(\d+)'),
              "ci_skips": grab("gui.log", r'跳过 (\d+) 次'),
          }
          Path("test-summary.json").write_text(json.dumps(summary, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False))
          # 相等门禁：通过数必须等于总数（部分通过≠通过，母法 8.6 / INV-04 的 CI 版）
          import sys
          for key in ("smoke_pass", "gui_pass", "stress_pass", "adversarial_pass", "property_pass"):
              m = re.match(r'(\d+)/(\d+)', summary[key])
              if not m or m.group(1) != m.group(2):
                  print(f"::error::{key} 未全过: {summary[key]}")
                  sys.exit(1)
          PY

      - name: Upload test logs + summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: |
            test-summary.json
            smoke.log
            gui.log
            stress.log
            adversarial.log
            property.log
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (密钥与敏感信息扫描，母法 10.3-5)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evidence:
    needs: [tests, secret-scan, governance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download test summary
        uses: actions/download-artifact@v4
        with: { name: test-summary }

      - name: Build evidence.json (sha / time / python / stats / artifact hashes / lock)
        run: |
          python - <<'PY'
          import json, subprocess, datetime, hashlib
          from pathlib import Path
          def sh(cmd): return subprocess.check_output(cmd, shell=True, text=True).strip()
          def tarhash(d):
              return sh(f"tar -cf - {d} | sha256sum").split()[0]
          summary = json.loads(Path("test-summary.json").read_text(encoding="utf-8")) \
                    if Path("test-summary.json").exists() else {}
          evidence = {
              "commit_sha": sh("git rev-parse HEAD"),
              "branch": sh("git rev-parse --abbrev-ref HEAD"),
              "timestamp_utc": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "python_version": sh("python3 --version"),
              "repeat_policy": {
                  "deterministic_single_run": "smoke/gui 合成数据 + 全 mock，单跑确定性（PROJECT-CONTRACT §7）",
                  "concurrency_rounds": "stress 连点/竞态 ≥50 轮/场景 + 随机时序抖动（seed 入 summary）",
                  "generative": "property ≥500 例/属性（seed 入 summary，PROPERTY_SEED 可复现）",
              },
              "ci_skips": summary.get("ci_skips", "?"),
              "lock_hash": hashlib.sha256(
                  Path("requirements-lock.txt").read_bytes()).hexdigest(),
              "tests": {
                  "smoke_pass": summary.get("smoke_pass", "?"),
                  "gui_pass": summary.get("gui_pass", "?"),
                  "stress_pass": summary.get("stress_pass", "?"),
                  "adversarial_pass": summary.get("adversarial_pass", "?"),
                  "property_pass": summary.get("property_pass", "?"),
                  "seeds": {"stress": summary.get("stress_seed", "?"),
                            "property": summary.get("property_seed", "?")},
                  "ci_skips": summary.get("ci_skips", "?"),
                  "secret_scan": "passed (job green)",
              },
              "artifact_hashes": {
                  "lit": tarhash("lit"),
                  "ui": tarhash("ui"),
                  "tests": tarhash("tests"),
              },
          }
          Path("evidence.json").write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8")
          print(Path("evidence.json").read_text(encoding="utf-8"))
          PY

      - name: Upload evidence-<sha>
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: evidence.json
          if-no-files-found: error
